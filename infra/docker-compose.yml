services:
  mysql:
    image: mysql:8.0
    container_name: avatar-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-avatar}
      MYSQL_USER: ${MYSQL_USER:-avatar}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-avatar}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    container_name: avatar-backend
    restart: unless-stopped
    environment:
      DATABASE_DSN: avatar:avatar@tcp(mysql:3306)/avatar?charset=utf8mb4
      HTTP_ADDR: ":8080"
      ML_BASE_URL: http://ml:8000
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      ml:
        condition: service_healthy

  ml:
    build:
      context: ../ml
      dockerfile: Dockerfile
    container_name: avatar-ml
    restart: unless-stopped
    ports:
      - "${ML_PORT:-8000}:8000"
    volumes:
      - ../ml/artifacts:/app/ml/artifacts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../web
    container_name: avatar-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - backend
      - ml

  web-m3:
    build:
      context: ../web
      dockerfile: Dockerfile.m3
    container_name: avatar-web-m3
    restart: unless-stopped
    ports:
      - "${WEB_M3_PORT:-5174}:80"
    depends_on:
      - backend
      - ml

  sonarqube:
    image: sonarqube:${SONARQUBE_VERSION:-lts-community}
    container_name: avatar-sonarqube
    restart: unless-stopped
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

  adminer:
    image: adminer:latest
    container_name: avatar-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      - mysql

volumes:
  mysql_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
